# ============================================================
# 头像引擎 · 宝塔伪静态规则
# 用法：宝塔 → 网站 → 设置 → 伪静态 → 粘贴以下全部内容 → 保存
#
# 前置条件：
#   1. 站点目录（网站根目录）设为 /www/wwwroot/myradar.cn/backend
#   2. 运行目录设为 /public（最终 nginx root = backend/public）
#   3. PHP 版本选择 8.2（已装 redis、fileinfo、gd 扩展）
#   4. 网站目录设置中关闭「防跨站攻击(open_basedir)」
#      （或在 .user.ini 中放行 /www/wwwroot/myradar.cn/storage/，见部署文档）
#
# 说明：
#   - 本文件只含 location 规则，不能写 server{}/root/fastcgi_pass
#   - admin/frontend/storage 在 backend/ 外层，用绝对路径 alias 挂载，与 root 无关
#   - 数据库/Redis 密码改 backend/config/database.php、redis.php
#   - JWT 密钥在 PHP-FPM 进程池配置 env[APP_JWT_SECRET]（见部署文档）
# ============================================================

# 上传体积
client_max_body_size 12m;

# 本地存储：/uploads/ → storage/uploads/（^~ 防止被图片缓存正则抢走）
location ^~ /uploads/ {
    alias /www/wwwroot/myradar.cn/storage/uploads/;
    expires 7d;
    access_log off;
    add_header Cache-Control "public, max-age=604800";
}

# 管理后台（PHP 入口）：/admin/ → admin/
# 注意：alias 目录下的 .php 必须在此 location 内嵌套解析，
# 否则走服务器级 PHP location 时 root 指向 backend/public，SCRIPT_FILENAME 找不到文件
location ^~ /admin/ {
    alias /www/wwwroot/myradar.cn/admin/;
    index index.php;
    try_files $uri $uri/ /admin/index.php;

    location ~ \.php$ {
        fastcgi_pass   unix:/tmp/php-cgi-83.sock;   # 按实际 PHP 版本 sock 修改（8.2→php-cgi-82.sock）
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $request_filename;
    }
}

# 官网静态资源：/static/ → frontend/
location ^~ /static/ {
    alias /www/wwwroot/myradar.cn/frontend/;
    expires 7d;
    access_log off;
}

# 禁止访问敏感文件/目录
location ~ /\.(ht|git|env) {
    deny all;
}
location ~ /(storage|app|core|config|routes|database|bin) {
    deny all;
}

# 主入口：所有未命中静态资源的请求转发给 index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
