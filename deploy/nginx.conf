server {
    listen      80;
    server_name avatar.local;   # 改成你的域名
    root        /www/wwwroot/avatar/backend/public;
    index       index.php index.html;
    charset     utf-8;

    # 访问日志
    access_log /www/wwwlogs/avatar.access.log;
    error_log  /www/wwwlogs/avatar.error.log;

    # 上传体积
    client_max_body_size 12m;

    # ── 本地存储静态资源映射（/uploads → storage/uploads） ──
    location /uploads/ {
        alias /www/wwwroot/avatar/storage/uploads/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── 管理后台（PHP 入口，admin/） ──
    location ^~ /admin/ {
        alias /www/wwwroot/avatar/admin/;
        index index.php;
        try_files $uri $uri/ /admin/index.php;

        location ~ \.php$ {
            fastcgi_pass   unix:/tmp/php-cgi-82.sock;   # 按实际 PHP 版本 sock 修改
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $request_filename;
        }
    }

    # ── 官网静态资源（/static → frontend/） ──
    location /static/ {
        alias /www/wwwroot/avatar/frontend/;
        expires 7d;
        access_log off;
    }

    # ── 主入口：所有未匹配静态资源走 index.php ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──
    location ~ \.php$ {
        fastcgi_pass   unix:/tmp/php-cgi-82.sock;   # 宝塔 PHP-8.2 sock，按实际改
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  APP_DEBUG        1;            # 生产改 0
        fastcgi_param  DB_HOST          127.0.0.1;
        fastcgi_param  DB_DATABASE      avatar;
        fastcgi_param  DB_USERNAME      avatar;
        fastcgi_param  DB_PASSWORD      change_me;
        fastcgi_param  REDIS_HOST       127.0.0.1;
        fastcgi_param  REDIS_PASSWORD   "";
        fastcgi_param  ARK_API_KEY      "";            # 豆包 API Key
        fastcgi_param  APP_JWT_SECRET   change-me-strong-secret;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # 禁止访问敏感文件
    location ~ /\.(ht|git|env) {
        deny all;
    }
    location ~ /(storage|app|core|config|routes|database|bin) {
        deny all;
    }
}
